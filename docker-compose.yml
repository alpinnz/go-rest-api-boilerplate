services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-rest-api-boilerplate
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=go-rest-api-boilerplate
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=change-this-secret-key
      - JWT_EXPIRATION=24h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

